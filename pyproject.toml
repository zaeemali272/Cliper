[project]
name = "cliper"
version = "0.1.0"
description = "Find the most-watched parts of a YouTube/Twitch video and cut them into Shorts/Reels. Free, local, no API keys."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["youtube", "twitch", "shorts", "reels", "clips", "yt-dlp", "ffmpeg"]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "certifi>=2026.7.22",
    "curl-cffi>=0.16.3",
    "fastapi>=0.110",
    "numpy>=1.26",
    "opencv-python-headless>=5.0.0.93",
    "platformdirs>=4",
    "python-multipart>=0.0.32",
    "requests>=2.31",
    "shazamio>=0.8.1",
    "static-ffmpeg>=2.7",
    "uvicorn[standard]>=0.29",
    "yt-dlp>=2025.1.1",
]

[project.optional-dependencies]
# Free local speech-to-text for videos without platform captions (Twitch). CPU is fine.
whisper = ["faster-whisper>=1.1"]

[project.scripts]
cliper = "cliper.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cliper"]
